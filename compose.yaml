services:
  postgres:
    image: postgres:17-alpine
    container_name: automaince-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: automaince
      POSTGRES_USER: automaince
      POSTGRES_PASSWORD: automaince_dev
    ports:
      - "5432:5432"
    volumes:
      - automaince-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automaince -d automaince"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  automaince-postgres-data:
